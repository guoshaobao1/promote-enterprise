<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职通招聘企业版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #FF590D 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            padding: 40px 30px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #FF590D;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        h1 {
            color: white;
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            color: rgba(255,255,255,0.85);
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: white;
            color: #FF590D;
            font-size: 18px;
            font-weight: 600;
            padding: 14px 48px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .hint {
            margin-top: 20px;
            color: rgba(255,255,255,0.65);
            font-size: 13px;
        }
        .download-btn {
            display: none;
            margin-top: 16px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 16px;
            font-weight: 500;
            padding: 12px 36px;
            border-radius: 30px;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.4);
            transition: background 0.2s;
        }
        .download-btn:active {
            background: rgba(255,255,255,0.3);
        }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 16px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 999;
            display: none;
            max-width: 80%;
            text-align: center;
            line-height: 1.5;
        }
        .toast.show {
            display: block;
            animation: fadeInOut 3s ease-in-out;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="logo.png" alt="职通招聘企业版">
        <h1>欢迎使用 职通招聘企业版</h1>
        <p>海量职位，精准匹配<br>助你找到理想员工</p>
        <a class="btn" href="#" id="openAppBtn">打开 App</a>
        <a class="download-btn" href="#" id="downloadBtn">前往应用市场下载</a>
        <p class="hint" id="fallbackHint" style="display:none;">
            未检测到 App？<br>
            <a href="#" style="color:white;text-decoration:underline;" id="downloadLink">下载职通招聘企业版 App</a>
        </p>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    (function() {
        var appOpened = false;
        var PACKAGE_NAME = 'cn.wildfire.enterprise';

        // 检测手机品牌
        function detectBrand() {
            var ua = navigator.userAgent.toLowerCase();
            if (ua.indexOf('huawei') > -1 || ua.indexOf('honor') > -1) {
                // 进一步区分华为和荣耀
                if (ua.indexOf('honor') > -1 || ua.indexOf('hihonor') > -1) {
                    return 'honor';
                }
                return 'huawei';
            }
            if (ua.indexOf('xiaomi') > -1 || ua.indexOf('mi ') > -1 || ua.indexOf('redmi') > -1) {
                return 'xiaomi';
            }
            if (ua.indexOf('oppo') > -1) {
                return 'oppo';
            }
            if (ua.indexOf('vivo') > -1) {
                return 'vivo';
            }
            if (ua.indexOf('samsung') > -1) {
                return 'samsung';
            }
            return 'unknown';
        }

        // 获取对应品牌应用市场的下载链接
        function getMarketUrl(brand) {
            switch (brand) {
                case 'xiaomi':
                    // 小米应用商店
                    return 'mimarket://details?id=' + PACKAGE_NAME;
                case 'oppo':
                    // OPPO 软件商店
                    return 'oppomarket://app/detail?pkgName=' + PACKAGE_NAME;
                case 'vivo':
                    // vivo 应用商店
                    return 'vivomarket://app/detail?packageName=' + PACKAGE_NAME;
                case 'huawei':
                    // 华为应用市场
                    return 'appmarket://details?id=' + PACKAGE_NAME;
                case 'honor':
                    // 荣耀应用市场
                    return 'honormarket://details?id=' + PACKAGE_NAME;
                default:
                    // 未知品牌，返回通用下载页（可替换为实际的通用下载地址）
                    return 'https://guoshaobao1.github.io/promote-enterprise/';
            }
        }

        // 获取应用市场的网页版备用链接（当 scheme 跳转失败时使用）
        function getMarketWebUrl(brand) {
            switch (brand) {
                case 'xiaomi':
                    return 'https://app.mi.com/details?id=' + PACKAGE_NAME;
                case 'oppo':
                    return 'https://www.oppomobile.com/';
                case 'vivo':
                    return 'https://app.vivo.com.cn/';
                case 'huawei':
                    return 'https://appgallery.huawei.com/app/C' + PACKAGE_NAME;
                case 'honor':
                    return 'https://appgallery.hihonor.com/';
                default:
                    return 'https://guoshaobao1.github.io/promote-enterprise/';
            }
        }

        // 直接跳转 App（token 由 App 原生代码获取，绕过浏览器 Mixed Content 限制）
        function tryOpenApp() {
            console.log('打开 App: enterprise://home');
            window.location.href = 'enterprise://home';
        }

        // 跳转到对应品牌的应用市场
        function openAppMarket() {
            var brand = detectBrand();
            var marketUrl = getMarketUrl(brand);
            var webUrl = getMarketWebUrl(brand);

            console.log('检测到手机品牌: ' + brand + ', 跳转应用市场: ' + marketUrl);

            // 尝试通过 scheme 跳转到应用市场 App
            var startTime = Date.now();
            window.location.href = marketUrl;

            // 如果 scheme 跳转失败（2秒后页面仍在），则跳转到网页版应用市场
            setTimeout(function() {
                if (!document.hidden && Date.now() - startTime < 3000) {
                    window.location.href = webUrl;
                }
            }, 2000);
        }

        function checkFallback() {
            setTimeout(function() {
                if (!appOpened && !document.hidden) {
                    document.getElementById('fallbackHint').style.display = 'block';
                    document.getElementById('downloadBtn').style.display = 'inline-block';
                    updateDownloadBtn();
                }
            }, 2500);
        }

        // 显示 Toast 提示
        function showToast(msg, duration) {
            var toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('show');
            // 触发重绘以重启动画
            void toast.offsetWidth;
            toast.classList.add('show');
            setTimeout(function() {
                toast.classList.remove('show');
            }, duration || 3000);
        }

        // 获取品牌中文名
        function getBrandName(brand) {
            var brandNames = {
                'xiaomi': '小米应用商店',
                'oppo': 'OPPO 软件商店',
                'vivo': 'vivo 应用商店',
                'huawei': '华为应用市场',
                'honor': '荣耀应用市场',
                'unknown': '应用市场'
            };
            return brandNames[brand] || '应用市场';
        }

        // 更新下载按钮文字
        function updateDownloadBtn() {
            var brand = detectBrand();
            var btn = document.getElementById('downloadBtn');
            btn.textContent = '前往' + getBrandName(brand) + '下载';
        }

        // 显示下载引导
        function showDownloadGuide() {
            var brand = detectBrand();
            var brandName = getBrandName(brand);
            showToast('未检测到 App，请前往' + brandName + '下载安装');
            document.getElementById('downloadBtn').style.display = 'inline-block';
            updateDownloadBtn();
        }

        document.getElementById('openAppBtn').addEventListener('click', function(e) {
            e.preventDefault();
            tryOpenApp();
            setTimeout(function() {
                if (!document.hidden) {
                    showDownloadGuide();
                }
            }, 1500);
        });

        document.getElementById('downloadBtn').addEventListener('click', function(e) {
            e.preventDefault();
            openAppMarket();
        });

        document.getElementById('downloadLink').addEventListener('click', function(e) {
            e.preventDefault();
            openAppMarket();
        });

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) appOpened = true;
        });
        window.addEventListener('pagehide', function() { appOpened = true; });
        window.addEventListener('blur', function() { appOpened = true; });

        document.addEventListener('DOMContentLoaded', function() {
            checkFallback();
        });
    })();
    </script>
</body>
</html>
