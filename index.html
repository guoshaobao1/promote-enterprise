<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职通招聘企业版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #FF590D 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            padding: 40px 30px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #FF590D;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        h1 {
            color: white;
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            color: rgba(255,255,255,0.85);
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: white;
            color: #FF590D;
            font-size: 18px;
            font-weight: 600;
            padding: 14px 48px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .hint {
            margin-top: 20px;
            color: rgba(255,255,255,0.65);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="logo.png" alt="职通招聘企业版">
        <h1>欢迎使用 职通招聘企业版</h1>
        <p>海量职位，精准匹配<br>助你找到理想员工</p>
        <a class="btn" href="#" id="openAppBtn">打开 App</a>
        <p class="hint" id="fallbackHint" style="display:none;">
            未检测到 App？<br>
            <a href="#" style="color:white;text-decoration:underline;" id="downloadLink">下载职通招聘企业版 App</a>
        </p>
    </div>

    <script>
    (function() {
        var BUILD_TIME = '2026-09-17 21:35:00';
        console.log('[promote-enterprise] 版本时间: ' + BUILD_TIME);
        var appOpened = false;
        var PACKAGE_NAME = 'cn.wildfire.enterprise';

        // 检测手机品牌
        function detectBrand() {
            var ua = navigator.userAgent.toLowerCase();
            console.log('当前 User-Agent: ' + navigator.userAgent);
            if (ua.indexOf('huawei') > -1 || ua.indexOf('honor') > -1) {
                // 进一步区分华为和荣耀
                if (ua.indexOf('honor') > -1 || ua.indexOf('hihonor') > -1) {
                    return 'honor';
                }
                return 'huawei';
            }
            if (ua.indexOf('xiaomi') > -1 || ua.indexOf('mi ') > -1 || ua.indexOf('redmi') > -1) {
                return 'xiaomi';
            }
            // OPPO/一加/真我（ColorOS/Heytap 系）：UA 中可能不含 oppo 字样，但会有 heytap/coloros/oplus/realme/oneplus 等特征
            if (ua.indexOf('oppo') > -1 || ua.indexOf('heytap') > -1 || ua.indexOf('coloros') > -1
                || ua.indexOf('oplus') > -1 || ua.indexOf('realme') > -1 || ua.indexOf('oneplus') > -1) {
                return 'oppo';
            }
            if (ua.indexOf('vivo') > -1) {
                return 'vivo';
            }
            if (ua.indexOf('samsung') > -1) {
                return 'samsung';
            }
            return 'unknown';
        }

        // 获取对应品牌应用市场的下载链接
        function getMarketUrl(brand) {
            switch (brand) {
                case 'xiaomi':
                    // 小米应用商店
                    return 'mimarket://details?id=' + PACKAGE_NAME;
                case 'oppo':
                    // OPPO 软件商店（欢太应用市场）
                    // 优先使用 oppomarket scheme（兼容性更好），失败再用标准 market://
                    return 'oppomarket://app/detail?pkgName=' + PACKAGE_NAME;
                case 'vivo':
                    // vivo 应用商店
                    return 'vivomarket://app/detail?packageName=' + PACKAGE_NAME;
                case 'huawei':
                    // 华为应用市场
                    return 'appmarket://details?id=' + PACKAGE_NAME;
                case 'honor':
                    // 荣耀应用市场
                    return 'honormarket://details?id=' + PACKAGE_NAME;
                default:
                    // 未知品牌，返回通用下载页（可替换为实际的通用下载地址）
                    return 'https://guoshaobao1.github.io/promote-enterprise/';
            }
        }

        // 获取应用市场的网页版备用链接（当 scheme 跳转失败时使用）
        function getMarketWebUrl(brand) {
            switch (brand) {
                case 'xiaomi':
                    return 'https://app.mi.com/details?id=' + PACKAGE_NAME;
                case 'oppo':
                    // OPPO 欢太应用商店网页版
                    return 'https://m.heytap.com/m/appdetail?pkgName=' + PACKAGE_NAME;
                case 'vivo':
                    return 'https://app.vivo.com.cn/';
                case 'huawei':
                    return 'https://appgallery.huawei.com/app/C' + PACKAGE_NAME;
                case 'honor':
                    return 'https://appgallery.hihonor.com/';
                default:
                    return 'https://guoshaobao1.github.io/promote-enterprise/';
            }
        }

        // 直接跳转 App（token 由 App 原生代码获取，绕过浏览器 Mixed Content 限制）
        function tryOpenApp() {
            console.log('打开 App: enterprise://home');
            // 使用 a 标签点击方式，比 window.location.href 更稳定
            var a = document.createElement('a');
            a.href = 'enterprise://home';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 跳转到对应品牌的应用市场
        function openAppMarket() {
            var brand = detectBrand();
            var marketUrl = getMarketUrl(brand);
            var webUrl = getMarketWebUrl(brand);
            // 标准 Android 应用市场 scheme（兜底用）
            var standardMarketUrl = 'market://details?id=' + PACKAGE_NAME;

            console.log('检测到手机品牌: ' + brand + ', 跳转应用市场: ' + marketUrl);

            // 使用 a 标签点击方式跳转，比 window.location.href 更稳定，不易被浏览器拦截
            function openByLink(url) {
                var a = document.createElement('a');
                a.href = url;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            var startTime = Date.now();
            openByLink(marketUrl);

            // 1.5秒后如果还在当前页，尝试标准 market:// scheme 兜底
            setTimeout(function() {
                if (!document.hidden && !appOpened && Date.now() - startTime < 3000) {
                    console.log('品牌 scheme 跳转失败，尝试标准 market scheme: ' + standardMarketUrl);
                    openByLink(standardMarketUrl);
                }
            }, 1500);

            // 3秒后如果还在当前页，跳转到网页版应用市场
            setTimeout(function() {
                if (!document.hidden && !appOpened && Date.now() - startTime < 4500) {
                    console.log('所有 scheme 跳转失败，跳转网页版: ' + webUrl);
                    window.location.href = webUrl;
                }
            }, 3000);
        }

        function checkFallback() {
            setTimeout(function() {
                if (!appOpened && !document.hidden) {
                    document.getElementById('fallbackHint').style.display = 'block';
                    updateDownloadLink();
                }
            }, 2500);
        }

        // 更新下载链接文字
        function updateDownloadLink() {
            var brand = detectBrand();
            var link = document.getElementById('downloadLink');
            var brandNames = {
                'xiaomi': '小米应用商店',
                'oppo': 'OPPO 软件商店',
                'vivo': 'vivo 应用商店',
                'huawei': '华为应用市场',
                'honor': '荣耀应用市场',
                'unknown': '应用市场'
            };
            link.textContent = '前往' + (brandNames[brand] || '应用市场') + '下载';
        }

        document.getElementById('openAppBtn').addEventListener('click', function(e) {
            e.preventDefault();
            tryOpenApp();
            setTimeout(function() {
                if (!document.hidden) {
                    document.getElementById('fallbackHint').style.display = 'block';
                    updateDownloadLink();
                }
            }, 1500);
        });

        document.getElementById('downloadLink').addEventListener('click', function(e) {
            e.preventDefault();
            openAppMarket();
        });

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) appOpened = true;
        });
        window.addEventListener('pagehide', function() { appOpened = true; });
        window.addEventListener('blur', function() { appOpened = true; });

        document.addEventListener('DOMContentLoaded', function() {
            checkFallback();
        });
    })();
    </script>
</body>
</html>
