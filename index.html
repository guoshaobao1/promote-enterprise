<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职通招聘企业版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #FF590D 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            padding: 40px 30px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #FF590D;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        h1 {
            color: white;
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            color: rgba(255,255,255,0.85);
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: white;
            color: #FF590D;
            font-size: 18px;
            font-weight: 600;
            padding: 14px 48px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .hint {
            margin-top: 20px;
            color: rgba(255,255,255,0.65);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="logo.png" alt="职通招聘企业版">
        <h1>欢迎使用 职通招聘企业版</h1>
        <p>海量职位，精准匹配<br>助你找到理想员工</p>
        <a class="btn" href="#" id="openAppBtn">打开 App</a>
        <p class="hint" id="fallbackHint" style="display:none;">
            未检测到 App？<br>
            <a href="#" style="color:white;text-decoration:underline;" id="downloadLink">下载职通招聘企业版 App</a>
        </p>
    </div>

    <script>
    (function() {
        var BASE_URL = 'http://192.144.156.150:9092';
        var appOpened = false;
        var token = null;

        // 页面加载时获取 token
        function fetchToken(callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', BASE_URL + '/user/loginRegister', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.timeout = 5000;
            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var resp = JSON.parse(xhr.responseText);
                        if (resp.code === '200' && resp.data && resp.data.token) {
                            token = resp.data.token;
                            console.log('Token获取成功');
                        }
                    } catch(e) {
                        console.error('Token解析失败:', e);
                    }
                }
                callback();
            };
            xhr.onerror = function() {
                console.error('Token请求失败');
                callback();
            };
            xhr.ontimeout = function() {
                console.error('Token请求超时');
                callback();
            };
            xhr.send(JSON.stringify({
                username: 'admin',
                password: '123456',
                phone: '13955274764'
            }));
        }

        function tryOpenApp() {
            var url = 'enterprise://home';
            if (token) {
                url += '?token=' + encodeURIComponent(token);
            }
            window.location.href = url;
        }

        function onPageVisibilityChange() {
            if (document.hidden) {
                appOpened = true;
            }
        }

        function checkFallback() {
            setTimeout(function() {
                if (!appOpened && !document.hidden) {
                    document.getElementById('fallbackHint').style.display = 'block';
                }
            }, 2500);
        }

        document.getElementById('openAppBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (token) {
                // 已有 token，直接打开
                tryOpenApp();
                setTimeout(function() {
                    if (!document.hidden) {
                        document.getElementById('fallbackHint').style.display = 'block';
                    }
                }, 1500);
            } else {
                // 先获取 token 再打开
                document.getElementById('openAppBtn').textContent = '正在准备...';
                fetchToken(function() {
                    document.getElementById('openAppBtn').textContent = '打开 App';
                    tryOpenApp();
                    setTimeout(function() {
                        if (!document.hidden) {
                            document.getElementById('fallbackHint').style.display = 'block';
                        }
                    }, 1500);
                });
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            // 页面加载时预取 token
            fetchToken(function() {});
            document.addEventListener('visibilitychange', onPageVisibilityChange);
            checkFallback();
        });

        window.addEventListener('pagehide', function() {
            appOpened = true;
        });
        window.addEventListener('blur', function() {
            appOpened = true;
        });
    })();
    </script>
</body>
</html>
